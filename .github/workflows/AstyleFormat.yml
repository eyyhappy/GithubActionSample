# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: C Code Format
on: [push, pull_request]  # 推送或PR时触发

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # 允许后续自动提交

      - name: 安装 astyle
        run: sudo apt-get update && sudo apt-get install -y astyle

      - name: 运行 astyle 自动格式化
        run: |
          IGNORE_LIST="--exclude=gwp_rpc_init.c --exclude=unity"
          find . -name "*.c" -o -name "*.h" | xargs astyle \
            --style=allman \
            --indent=spaces=4 \
            --indent-switches \
            --indent-namespaces \
            --pad-oper \
            --indent-labels \
            --min-conditional-indent=0 \
            --max-continuation-indent=40 \
            --convert-tabs \
            --indent-preproc-block \
            --delete-empty-lines \
            --suffix=none \
            --ignore-exclude-errors \
            $IGNORE_LIST

      - name: 提交格式化后的代码
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Auto format C code with astyle"
          # commit_user_name: "GitHub Actions Bot"
          commit_user_name: "My GitHub Actions Bot" # defaults to "github-actions[bot]"
          commit_author: "Author <actions@github.com>" # defaults to "username <numeric_id+username@users.noreply.github.com>", where "numeric_id" and "username" belong to the author of the commit that triggered the run
          commit_user_email: "actions@github.com"

# 本地调试建议：
# 1. 安装 act: https://github.com/nektos/act
# 2. 在项目根目录运行 act，模拟 GitHub Actions 执行流程
# 3. 可用 act -l 查看支持的事件类型
# 4. act 支持大部分常用 actions，但部分官方/第三方 actions 可能有兼容性问题
